<svg viewBox="0 0 480 650" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="diagTitle diagDesc">
  <title id="diagTitle">Diagnostic reasoning chain, symptom through resolution</title>
  <desc id="diagDesc">Symptom: 90% train, 50 to 70% test accuracy, run to run. Overfitting hypothesis, ruled out after both train and test accuracy fell together under a capacity cut. Resolution hypothesis: images were too low resolution, upscaled to 224 pixels. Confirmed: accuracy rose and variance disappeared. Remaining plateau: single model around 70%, a separate ceiling, not a misdiagnosis. Ensemble fix: three models combined reached 80.82% accuracy.</desc>

  <defs>
    <marker id="arrowSolid" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2E2E2E"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a9a49a"/>
    </marker>
  </defs>

  <style>
    .box-solid { fill: #ffffff; stroke: #141414; stroke-width: 1.4; }
    .box-dashed { fill: #ffffff; stroke: #a9a49a; stroke-width: 1.4; stroke-dasharray: 6 4; }
    .box-final { fill: #141414; stroke: #141414; stroke-width: 1.4; }
    .lbl { font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; }
    .lbl-muted { fill: #6b6b68; }
    .lbl-light { fill: #efece5; }
    .body-strong { font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 15px; fill: #141414; }
    .body-strong-light { font-family: 'IBM Plex Sans', sans-serif; font-weight: 600; font-size: 16px; fill: #ffffff; }
    .body { font-family: 'IBM Plex Sans', sans-serif; font-weight: 400; font-size: 14.5px; fill: #141414; }
    .body-light { font-family: 'IBM Plex Sans', sans-serif; font-weight: 400; font-size: 14.5px; fill: #f7f6f4; }
    .connector { stroke: #2E2E2E; stroke-width: 1.4; fill: none; }
    .connector-muted { stroke: #a9a49a; stroke-width: 1.4; fill: none; }
  </style>

  <!-- 1. Symptom -->
  <rect class="box-solid" x="20" y="10" width="440" height="70" rx="5"/>
  <text class="lbl lbl-muted" x="38" y="34">Symptom</text>
  <text class="body-strong" x="38" y="58">90% train — 50–70% test, run to run</text>

  <line class="connector" x1="240" y1="80" x2="240" y2="106" marker-end="url(#arrowSolid)"/>

  <!-- 2. Overfitting hypothesis (wrong turn) -->
  <rect class="box-dashed" x="20" y="106" width="440" height="60" rx="5"/>
  <text class="lbl lbl-muted" x="38" y="130">Hypothesis — wrong turn</text>
  <text class="body" x="38" y="152">Overfitting → cut model capacity</text>

  <line class="connector-muted" x1="240" y1="166" x2="240" y2="192" marker-end="url(#arrowMuted)"/>

  <!-- 3. Ruled out -->
  <rect class="box-dashed" x="20" y="192" width="440" height="60" rx="5"/>
  <text class="lbl lbl-muted" x="38" y="216">Ruled out</text>
  <text class="body" x="38" y="238">Train + test accuracy fell together</text>

  <line class="connector" x1="240" y1="252" x2="240" y2="278" marker-end="url(#arrowSolid)"/>

  <!-- 4. Resolution hypothesis -->
  <rect class="box-solid" x="20" y="278" width="440" height="70" rx="5"/>
  <text class="lbl lbl-muted" x="38" y="302">Resolution hypothesis</text>
  <text class="body-strong" x="38" y="326">128×128 → upscaled to 224×224</text>

  <line class="connector" x1="240" y1="348" x2="240" y2="374" marker-end="url(#arrowSolid)"/>

  <!-- 5. Confirmed -->
  <rect class="box-solid" x="20" y="374" width="440" height="60" rx="5"/>
  <text class="lbl lbl-muted" x="38" y="398">Confirmed</text>
  <text class="body-strong" x="38" y="420">Accuracy up, variance gone</text>

  <line class="connector" x1="240" y1="434" x2="240" y2="460" marker-end="url(#arrowSolid)"/>

  <!-- 6. Remaining plateau -->
  <rect class="box-solid" x="20" y="460" width="440" height="60" rx="5"/>
  <text class="lbl lbl-muted" x="38" y="484">Remaining plateau — separate problem</text>
  <text class="body" x="38" y="506">Single model, ~70%</text>

  <line class="connector" x1="240" y1="520" x2="240" y2="546" marker-end="url(#arrowSolid)"/>

  <!-- 7. Ensemble fix — final -->
  <rect class="box-final" x="20" y="546" width="440" height="86" rx="5"/>
  <text class="lbl lbl-light" x="38" y="570">Ensemble fix</text>
  <text class="body-strong-light" x="38" y="596">3 CNNs, averaged + tuned threshold</text>
  <text class="body-light" x="38" y="618">80.82% accuracy</text>

</svg>
